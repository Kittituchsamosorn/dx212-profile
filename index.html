<!DOCTYPE html>
<html lang="en">

			background-color: #e3f2fd;
			color: #333;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
		}

		.profile-card {
			background: white;

			border: 4px solid #2196f3;
			margin-bottom: 20px;
		}

			margin: 0;
			color: #0d47a1;
			font-size: 24px;
		}

		.subtitle {
			color: #1976d2;
			font-size: 14px;

		}

		.intro {
			text-align: left;
			line-height: 1.6;
			margin-bottom: 25px;
			font-size: 15px;
		}

		.github-btn {
			display: inline-block;
			background-color: #1e88e5;
			color: #fff;
			padding: 10px 20px;
			border-radius: 25px;
			text-decoration: none;
			font-weight: 600;
			transition: background 0.3s;
		}

		.github-btn:hover {
			background-color: #1565c0;
		}
	</style>
</head>
